  # SDK image (~750MB) nặng hơn runtime image — chỉ bật service đang làm việc.

  # KHÔNG chạy `docker compose ... --build product-service` khi hot reload đang bật —
  # bake sẽ tag output Dockerfile đè lên image: hvt-dotnet-sdk:8.0-alpine-dev.
