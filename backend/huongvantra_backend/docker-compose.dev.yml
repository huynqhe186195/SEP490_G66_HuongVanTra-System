# ─────────────────────────────────────────────────────────────────────────────
# Dev overlay — CHỈ DÙNG Ở MÁY DEV, KHÔNG DÙNG TRÊN VPS.
#
# Hai việc overlay này làm:
#   1. Bind mount + hot reload (Vite cho frontend, dotnet watch cho backend).
#   2. SEC-05: mở lại các port debug mà docker-compose.yml (production) đã bỏ —
#      MySQL 3307, RabbitMQ 5672/15672, và từng microservice 5001-5007.
#      Production chỉ publish gateway 5000 + web-client 3000.
#
# Chạy toàn bộ stack dev:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Chỉ chạy frontend dev (infra + gateway giữ nguyên production image):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up \
#     mysql rabbitmq gateway web-client
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Frontend: thay build nginx bằng Vite dev server ────────────────────────
  # !reset build: bắt buộc — nếu chỉ ghi build: null, Compose vẫn build Dockerfile
  # production rồi GHI ĐÈ tag node:20-bookworm-slim → mất npm, container restart mãi.
  web-client:
    build: !reset null
    image: node:20-bookworm-slim
    pull_policy: missing
    container_name: hvt-web-client-dev
    working_dir: /app
    volumes:
      - ../../frontend/huongvantra-web-client:/app          # source code live
      - web_client_node_modules:/app/node_modules           # giữ node_modules trong container
    ports: !override
      - "5173:5173"                      # Vite dev server (thay port 3000 của nginx)
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - hvt-network
    depends_on:
      - gateway

  # ── Gateway: bind mount appsettings để thay đổi routes không cần rebuild ───
  # Sau khi sửa appsettings.json chỉ cần: docker restart hvt-gateway
  gateway:
    volumes:
      - ./API_Gateway/HuongVanTra.Gateway/appsettings.json:/app/appsettings.json:ro

  # ── SEC-05: mở lại port infra để debug từ máy dev ──────────────────────────
  # 127.0.0.1 để chỉ máy đang chạy Docker truy cập được, không mở ra LAN.
  mysql:
    ports:
      - "127.0.0.1:3307:3306"            # MySQL Workbench / DBeaver

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"          # Management UI

  audit-service:
    ports:
      - "127.0.0.1:5007:8080"

  # ── Backend: port debug + tuỳ chọn dotnet watch ────────────────────────────
